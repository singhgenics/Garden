<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cabin East Garden</title>
<meta name="description" content="Cabin East Garden: 3D model of a 32-cover pub, kitchen, dish wash, washroom and store, with roll-down PVC curtains.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Yellowtail&display=swap">
<style>
:root{--bg:#130f0c;--fg:#f3ecdf;--muted:#b9a994;--amber:#e9b54a;--ox:#c4573c;--line:rgba(255,255,255,.14);--panel:rgba(27,21,18,.94);--raise:rgba(255,255,255,.06);
  --display:"Bricolage Grotesque",system-ui,sans-serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.5 var(--body);overflow:hidden}
#stage{position:fixed;inset:0;background:#1d1720}
#stage canvas{display:block;width:100%;height:100%}
.labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;white-space:nowrap;font:500 11.5px/1 var(--body);color:var(--fg);background:rgba(19,15,12,.86);border:1px solid var(--line);border-radius:999px;padding:5px 9px 5px 7px;display:flex;gap:6px;align-items:center;will-change:transform}
.lbl i{width:7px;height:7px;border-radius:50%;background:var(--amber);flex:none}
.lbl.k i{background:#9fb4c2}.lbl.w i{background:#8fd3c0}.lbl.o i{background:var(--ox)}.lbl.d{font:500 11px/1 var(--mono);border-color:rgba(233,181,74,.5)}.lbl.d i{display:none}
.toolbar{position:absolute;left:12px;right:12px;top:12px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.seg{pointer-events:auto;display:flex;flex-wrap:wrap;gap:2px;background:rgba(19,15,12,.88);border:1px solid var(--line);border-radius:12px;padding:3px;width:max-content;max-width:100%}
.seg button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 12px/1 var(--body);padding:8px 11px;border-radius:9px;cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--fg);background:rgba(255,255,255,.06)}
.seg button[aria-pressed="true"]{background:var(--amber);color:#1b120a}
.seg a.seglink{color:var(--muted);font:500 12px/1 var(--body);padding:8px 11px;border-radius:9px;text-decoration:none;white-space:nowrap}.seg a.seglink:hover,.seg a.seglink:focus-visible{color:var(--fg);background:rgba(255,255,255,.06)}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dimmer{pointer-events:auto;display:flex;align-items:center;gap:8px;background:rgba(19,15,12,.88);border:1px solid var(--line);border-radius:12px;padding:6px 12px;font:500 12px/1 var(--body);color:var(--muted)}
.dimmer input{accent-color:var(--amber);width:110px}
.brand{pointer-events:none;font:700 15px/1 var(--display);letter-spacing:-.01em;display:flex;gap:10px;align-items:baseline}
.brand span{font:400 11.5px/1 var(--mono);color:var(--muted)}
.lightctl{flex-direction:column;gap:6px;padding:8px 10px;pointer-events:auto}.lightctl[hidden]{display:none}.lc-row{display:flex;align-items:center;gap:8px;font:500 12px/1 var(--body);color:var(--muted)}.lc-k{width:44px;color:var(--fg)}.lc-row input{accent-color:var(--amber);width:150px}.lc-v{font-family:var(--mono);font-size:11px;min-width:86px}.lc-pre button{appearance:none;border:0;background:transparent;color:var(--muted);font:500 12px/1 var(--body);padding:7px 10px;border-radius:9px;cursor:pointer}.lc-pre button:hover{color:var(--fg);background:rgba(255,255,255,.06)}.lc-pre button[aria-pressed="true"]{background:var(--amber);color:#1b120a}
.card{position:absolute;right:12px;bottom:12px;width:min(380px,calc(100% - 24px));max-height:min(58%,calc(100% - 190px));overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:13px}
.card h2{font:700 17px/1.2 var(--display);margin:0 0 2px}
.card .eye{font:500 11px/1 var(--mono);color:var(--amber);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.card p{margin:6px 0;color:#dacbb8}.card ul{margin:6px 0 0;padding-left:18px;color:#dacbb8}.card li{margin:3px 0}
.card table{border-collapse:collapse;width:100%;margin:8px 0}.card td{padding:2px 0;border-bottom:1px solid var(--line)}.card td:last-child{text-align:right;font-family:var(--mono);font-size:12px;white-space:nowrap}
.card .x{position:absolute;right:8px;top:6px;appearance:none;border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}
.hint{position:absolute;left:12px;bottom:12px;font:400 11.5px/1.3 var(--mono);color:var(--muted);background:rgba(19,15,12,.74);padding:6px 9px;border-radius:8px;pointer-events:none}
.pad{position:absolute;left:12px;bottom:56px;display:none;grid-template-columns:repeat(3,44px);gap:4px}
.pad button{height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(19,15,12,.86);color:var(--fg);font-size:16px}
body.walk .pad{display:grid}
.err{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted)}
@media (max-width:760px){
  .toolbar{left:8px;right:8px;top:8px;gap:6px}.brand{font-size:14px}.brand span{display:none}
  #views,.row2{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;max-width:100%;pointer-events:auto}
  #views::-webkit-scrollbar,.row2::-webkit-scrollbar{display:none}#views{width:auto}.row2 .seg{flex:none}
  .seg button,.seg a.seglink{padding:9px 11px;font-size:12px;min-height:34px}
  .card{left:8px;right:8px;bottom:8px;width:auto;max-height:42%;padding:10px 12px;font-size:12.5px}
  .card.min{cursor:pointer}.card.min p,.card.min ul,.card.min table{display:none}.card.min h2{font-size:15px;margin:0}.card.min .eye{margin-bottom:4px}.card.min .eye::after{content:'  ·  tap for details';color:var(--muted);text-transform:none;letter-spacing:0}
  .lbl{font-size:10.5px;padding:4px 7px 4px 6px}.hint{display:none}.pad{bottom:96px}}
</style>
</head>
<body>
<div id="stage">
  <div class="labels" id="labels"></div>
  <div class="toolbar">
    <div class="brand">Cabin East · Garden <span>35 covers · 5 × 4 + 2 × 6 + 3 at the ledge</span></div>
    <div class="seg" role="group" aria-label="Camera" id="views">
      <button data-view="iso" aria-pressed="true">Overview</button>
      <button data-view="decor" aria-pressed="false">Decor wall</button>
      <button data-view="tv" aria-pressed="false">TV corner</button>
      <button data-view="gate" aria-pressed="false">Gate</button>
      <button data-view="garden" aria-pressed="false">Garden</button>
      <button data-view="approach" aria-pressed="false">Approach</button>
      <button data-view="entry" aria-pressed="false">Entrance</button>
      <button data-view="bar" aria-pressed="false">Bar front</button>
      <button data-view="backbar" aria-pressed="false">Back bar</button>
      <button data-view="kitchen" aria-pressed="false">Kitchen</button>
      <button data-view="dish" aria-pressed="false">Dish wash</button>
      <button data-view="wash" aria-pressed="false">Washroom</button>
      <button data-view="store" aria-pressed="false">Store room</button>
      <button data-view="outside" aria-pressed="false">From outside</button>
      <button data-view="plan" aria-pressed="false">Plan</button>
      <button data-view="walk" aria-pressed="false">Walk in</button>
    </div>
    <div class="row2">
      <div class="seg" role="group" aria-label="Display">
        <button id="t-roof" aria-pressed="true">Roof</button>
        <button id="t-pvc" aria-pressed="true">PVC curtains down</button>
        <button id="t-lbl" aria-pressed="true">Labels</button>
        <button id="t-dims" aria-pressed="false">Sizes</button>
      </div>
      <div class="seg"><a class="seglink" href="decor.html">Decor concept &rarr;</a></div>
      <div class="seg"><button id="t-light" aria-expanded="false" aria-controls="lightpanel">Lighting · <span id="lc-name">Evening</span> ▾</button></div>
    </div>
    <div class="seg lightctl" id="lightpanel" role="group" aria-label="Lighting" hidden>
      <div class="lc-row"><span class="lc-k">Time</span><span class="lc-e">Day</span><input id="lc-time" type="range" min="0" max="100" value="85" aria-label="Time of day, day to night"><span class="lc-e">Night</span></div>
      <div class="lc-row"><span class="lc-k">Lights</span><span class="lc-e">Off</span><input id="lc-dim" type="range" min="0" max="100" value="80" aria-label="Dim all lights"><span class="lc-v" id="lc-read">80% · 2700 K</span></div>
      <div class="lc-row lc-pre"><button data-pre="lunch">Lunch</button><button data-pre="dusk">Sunset</button><button data-pre="evening" aria-pressed="true">Evening</button><button data-pre="late">Late</button></div>
    </div>
  </div>
  <div class="card" id="card"><button class="x" id="cardx" aria-label="Close">×</button><div id="cardbody"></div></div>
  <div class="hint" id="hint">Drag to orbit · scroll to zoom · right-drag to pan</div>
  <div class="pad" id="pad"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
<script>
(function(){
const stage=document.getElementById('stage');
if(!window.THREE||!THREE.OrbitControls){stage.insertAdjacentHTML('beforeend','<div class="err">The 3D viewer could not load. Reload the page to try again.</div>');return;}
function rng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
function shade(hex,f){const n=parseInt(hex.slice(1),16);return 'rgb('+[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,Math.round(v*f)))).join(',')+')';}
const Q=new URLSearchParams(location.search);

function init(){
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance',preserveDrawingBuffer:Q.has('shot')});}catch(e){stage.insertAdjacentHTML('beforeend','<div class="err">This device could not start WebGL, so the 3D model cannot show here.</div>');return;}
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,Q.has('shot')?1:(window.matchMedia('(max-width:900px)').matches?1.25:1.5)));
renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();let dirty=true;
const camera=new THREE.PerspectiveCamera(48,1,0.05,300);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.08;controls.minDistance=0.3;controls.maxDistance=60;controls.rotateSpeed=0.6;controls.screenSpacePanning=true;

/* ======================= PLAN (metres; plan x = east, plan y = south = three z) ======================= */
const A=[0,0],B=[15.67,0],C=[15.67,5.48],D=[6.46,5.48],Hh=[6.46,10.93],Gp=[3.48,10.93],Fp=[0,7.76];
const hall=[A,B,C,D,Hh,Gp,Fp];
const T=0.2,HX=15.67,BX0=HX+1.6,BX1=BX0+5.41,BY1=6.38,DISH=2.0,SD=6.46,SY1=BY1+SD,SX0=BX1-2.7,TX0=BX0+2.45,TY0=-1.7;
const hc=z=>3.4-0.06*Math.max(0,z);                 // ceiling (soffit) height of the hall, falls 6 cm per metre towards the open south edge
const BH=3.0;                                       // block ceiling height
const zEnd=x=>x<=3.48?7.76+x*(3.17/3.48):x<=6.46?10.93:5.48;
const xRange=z=>z<=5.48?[0,HX]:z<=7.76?[0,6.46]:[(z-7.76)*3.48/3.17,6.46];

/* ======================= textures ======================= */
const aniso=Math.min(8,renderer.capabilities.getMaxAnisotropy());
function tex(w,h,draw,rx,ry){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g,w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(rx||1,ry||1);t.anisotropy=aniso;return t;}
function woodDraw(base,n){return(g,w,h)=>{const r=rng(7);n=n||8;for(let i=0;i<n;i++){const y=i*h/n;g.fillStyle=shade(base,0.9+r()*0.2);g.fillRect(0,y,w,h/n);g.strokeStyle='rgba(90,55,25,.14)';for(let k=0;k<6;k++){g.beginPath();const yy=y+r()*h/n;g.moveTo(0,yy);g.bezierCurveTo(w*.3,yy+r()*6-3,w*.6,yy+r()*6-3,w,yy);g.stroke();}g.fillStyle='rgba(60,35,15,.4)';g.fillRect(0,y,w,1.5);}};}
const limeTex=tex(256,256,(g,w)=>{g.fillStyle='#e6d9c0';g.fillRect(0,0,w,w);const r=rng(27);for(let i=0;i<1400;i++){g.fillStyle=`rgba(${r()<.5?'255,245,225':'150,120,90'},${r()*0.07})`;g.beginPath();g.arc(r()*w,r()*w,4+r()*22,0,7);g.fill();}},3,2);
const brickTex=tex(256,256,(g,w)=>{g.fillStyle='#d9cfc2';g.fillRect(0,0,w,w);const r=rng(9);const bh=w/8,bw=w/4;for(let row=0;row<8;row++){const off=row%2?bw/2:0;for(let c=-1;c<5;c++){const x=c*bw+off;g.fillStyle=shade(['#a9533a','#b45f42','#9c4a33','#b86a4a','#a2563c'][Math.floor(r()*5)],0.92+r()*0.14);g.fillRect(x+2,row*bh+2,bw-4,bh-4);}}},1,1);
const plankTex=tex(512,512,woodDraw('#c9a06c',10),1,1);
const timberTex=tex(512,512,woodDraw('#a8764a'),1,1);
const darkWoodTex=tex(512,512,woodDraw('#6f4528',9),1,1);
const flutedTex=tex(64,16,(g,w,h)=>{const gr=g.createLinearGradient(0,0,w,0);gr.addColorStop(0,'#7a4e2c');gr.addColorStop(.5,'#cf9c6a');gr.addColorStop(1,'#7a4e2c');g.fillStyle=gr;g.fillRect(0,0,w,h);},1,1);
const marbleTex=tex(512,256,(g,w,h)=>{g.fillStyle='#f1ede6';g.fillRect(0,0,w,h);const r=rng(17);for(let i=0;i<26;i++){g.strokeStyle=`rgba(150,140,128,${0.12+r()*0.25})`;g.lineWidth=0.5+r()*1.6;g.beginPath();let x=r()*w,y=0;g.moveTo(x,y);for(let k=0;k<6;k++){x+=r()*90-45;y+=h/6;g.lineTo(x,y);}g.stroke();}},1,1);
const checkerTex=tex(128,128,(g,w)=>{const r=rng(12);for(let y=0;y<2;y++)for(let x=0;x<2;x++){const dark=(x+y)%2;g.fillStyle=dark?'#4a4440':'#efe6d6';g.fillRect(x*64,y*64,64,64);for(let i=0;i<260;i++){g.fillStyle=`rgba(${dark?'255,255,255':'60,45,30'},${r()*0.06})`;g.fillRect(x*64+r()*64,y*64+r()*64,2,2);}}g.strokeStyle='rgba(40,34,30,.55)';g.lineWidth=2;g.strokeRect(0,0,w,w);},1,1);
const darkCheckerTex=tex(128,128,(g,w)=>{const r=rng(12);for(let y=0;y<2;y++)for(let x=0;x<2;x++){const dark=(x+y)%2;g.fillStyle=dark?'#1c1917':'#34302b';g.fillRect(x*64,y*64,64,64);for(let i=0;i<200;i++){g.fillStyle=`rgba(255,255,255,${r()*0.04})`;g.fillRect(x*64+r()*64,y*64+r()*64,2,2);}}g.strokeStyle='rgba(0,0,0,.5)';g.lineWidth=2;g.strokeRect(0,0,w,w);},1,1);
const terraTex=tex(256,256,(g,w)=>{const r=rng(5),n=4,s=w/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){g.fillStyle=shade(['#b8623f','#c06c46','#ad5a3a','#b96845'][Math.floor(r()*4)],0.92+r()*0.14);g.fillRect(i*s,j*s,s,s);g.strokeStyle='rgba(70,35,20,.55)';g.lineWidth=3;g.strokeRect(i*s,j*s,s,s);}for(let i=0;i<500;i++){g.fillStyle=`rgba(0,0,0,${r()*0.08})`;g.fillRect(r()*w,r()*w,2,2);}},1/1.2,1/1.2);
const quarryTex=tex(256,256,(g,w)=>{const r=rng(8),n=4,s=w/n;for(let i=0;i<n;i++)for(let j=0;j<n;j++){g.fillStyle=shade('#7c6a5c',0.9+r()*0.18);g.fillRect(i*s,j*s,s,s);g.strokeStyle='rgba(30,25,20,.6)';g.lineWidth=3;g.strokeRect(i*s,j*s,s,s);}for(let i=0;i<600;i++){g.fillStyle=`rgba(255,255,255,${r()*0.06})`;g.fillRect(r()*w,r()*w,2,2);}},1/1.2,1/1.2);
const sageTex=tex(128,128,(g,w)=>{g.fillStyle='#e8ebe0';g.fillRect(0,0,w,w);const r=rng(4);const th=16,tw=32;for(let row=0;row<8;row++){const off=row%2?tw/2:0;for(let c=-1;c<5;c++){g.fillStyle=shade('#7f8c56',0.9+r()*0.18);g.fillRect(c*tw+off+1,row*th+1,tw-2,th-2);g.fillStyle='rgba(255,255,255,.2)';g.fillRect(c*tw+off+3,row*th+2,tw-8,3);}}},1,1);
const whiteTileTex=tex(64,64,(g,w)=>{g.fillStyle='#b9b6b0';g.fillRect(0,0,w,w);g.fillStyle='#f1eee8';for(let y=0;y<4;y++)for(let x=0;x<4;x++)g.fillRect(x*16+1,y*16+1,14,14);},1,1);
const mosaicTex=tex(128,128,(g,w)=>{const r=rng(12);for(let y=0;y<16;y++)for(let x=0;x<16;x++){g.fillStyle=shade(['#8a9b6a','#b8c08e','#6f8056','#a8b07c'][Math.floor(r()*4)],0.9+r()*0.2);g.fillRect(x*8,y*8,7,7);}},1,1);
const concTex=tex(256,256,(g,w)=>{g.fillStyle='#bdb8b0';g.fillRect(0,0,w,w);const r=rng(19);for(let i=0;i<900;i++){g.fillStyle=`rgba(${r()<.5?'255,255,255':'60,55,50'},${r()*0.06})`;g.beginPath();g.arc(r()*w,r()*w,2+r()*14,0,7);g.fill();}},1/1.5,1/1.5);
const gravelTex=tex(256,256,(g,w)=>{g.fillStyle='#8f7258';g.fillRect(0,0,w,w);const r=rng(23);for(let i=0;i<3000;i++){g.fillStyle=shade(['#a98f72','#7c644c','#bfa587','#6f5a46'][i%4],0.9+r()*0.2);g.beginPath();g.arc(r()*w,r()*w,0.8+r()*2.2,0,7);g.fill();}},60,60);
const grassTex=tex(256,256,(g,w)=>{g.fillStyle='#667a4c';g.fillRect(0,0,w,w);const r=rng(3);for(let i=0;i<3500;i++){g.fillStyle=`rgba(${40+r()*50},${90+r()*70},40,.55)`;g.fillRect(r()*w,r()*w,2,3);}},50,50);
const leafTex=tex(256,256,(g,w)=>{g.fillStyle='#24502e';g.fillRect(0,0,w,w);const r=rng(21);for(let i=0;i<300;i++){g.save();g.translate(r()*w,r()*w);g.rotate(r()*6.3);g.fillStyle=shade(['#4f9448','#3f8a45','#6aa852','#2e6a3a'][i%4],0.85+r()*0.3);g.beginPath();g.ellipse(0,0,6+r()*10,3+r()*4,0,0,Math.PI*2);g.fill();g.restore();}},1,1);

const CARDS={

function free(x,z){for(const [a,b] of solids){const dx=b[0]-a[0],dz=b[1]-a[1],L2=dx*dx+dz*dz||1,t=Math.max(0,Math.min(1,((x-a[0])*dx+(z-a[1])*dz)/L2));if(Math.hypot(x-(a[0]+dx*t),z-(a[1]+dz*t))<0.3)return false;}return true;}
const keys={};addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.querySelectorAll('#pad button').forEach(b=>{const k=b.dataset.k;b.addEventListener('pointerdown',()=>keys[k]=true);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false));});
let drag=null;renderer.domElement.addEventListener('pointerdown',e=>{if(walk){drag=[e.clientX,e.clientY];renderer.domElement.setPointerCapture(e.pointerId);}});

function step(dt){if(!walk)return;const f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),r=(keys.d?1:0)-(keys.a?1:0),tr=(keys.arrowright?1:0)-(keys.arrowleft?1:0);if(tr){yaw-=tr*dt*1.6;applyLook();}if(!f&&!r)return;
  const sp=1.7*dt,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw),dx=(fx*f+rx*r)*sp,dz=(fz*f+rz*r)*sp,x=camera.position.x,z=camera.position.z;

// each view's fov is written for a landscape screen; on a portrait phone, widen it so the same width of the scene stays in frame
function fitFov(f){const a=camera.aspect;if(a>=1.3)return f;const t=Math.tan(f*Math.PI/360)*1.3/a;return Math.min(88,2*Math.atan(t)*180/Math.PI);}

/* ---- speed: merge every static mesh of each group into one mesh per material (thousands of draw calls become a few dozen) ---- */
(function mergeStatic(){const U=THREE.BufferGeometryUtils;if(!U||!U.mergeBufferGeometries)return;
  ['ground','floors','walls','roof','deco','hall','bar','kitchen','dish','wash','store','fans'].forEach(k=>{const grp=G[k];grp.updateMatrixWorld(true);const buckets=new Map(),kill=[];
    grp.traverse(o=>{if(!o.isMesh||o.isInstancedMesh||!o.visible||Array.isArray(o.material)||!o.geometry||!o.geometry.attributes||!o.geometry.attributes.position)return;
      let g=o.geometry.clone();g.applyMatrix4(o.matrixWorld);if(g.index)g=g.toNonIndexed();
      ['uv2','color','tangent'].forEach(n=>{if(g.attributes[n])g.deleteAttribute(n);});if(!g.attributes.uv||!g.attributes.normal)return;g.clearGroups();
      const key=o.material.uuid+'|'+(o.castShadow?1:0)+(o.receiveShadow?1:0)+'|'+o.renderOrder;let b=buckets.get(key);if(!b){b={mat:o.material,cast:o.castShadow,recv:o.receiveShadow,ro:o.renderOrder,list:[]};buckets.set(key,b);}b.list.push(g);kill.push(o);});
    kill.forEach(o=>{if(o.parent)o.parent.remove(o);o.geometry.dispose();});
    buckets.forEach(b=>{const mg=U.mergeBufferGeometries(b.list,false);if(!mg)return;const m=new THREE.Mesh(mg,b.mat);m.castShadow=b.cast;m.receiveShadow=b.recv;m.renderOrder=b.ro;m.frustumCulled=false;grp.add(m);b.list.forEach(g=>g.dispose());});});})();

const _lp=new THREE.Vector3(),_lq=new THREE.Quaternion();let _lf=0;
let last=performance.now();
let frames=0;
const PR_MAX=renderer.getPixelRatio();let prNow=PR_MAX,slow=0,fast=0;

  else if(fast>90&&prNow<PR_MAX){prNow=Math.min(PR_MAX,prNow+0.25);renderer.setPixelRatio(prNow);resize();fast=0;}}

  requestAnimationFrame(loop);}
