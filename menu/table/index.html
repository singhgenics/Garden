<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Konso · The table</title>
<meta name="description" content="The Konso food menu on a revolving table. Turn it to see each dish, open a dish to see what goes into it.">
<meta name="theme-color" content="#1F3D2E">
<link rel="preload" href="assets/fonts/Prata-Regular.ttf" as="font" type="font/ttf" crossorigin>
<style>
@font-face{font-family:Prata;src:url(assets/fonts/Prata-Regular.ttf);font-display:swap}
@font-face{font-family:Mont;src:url(assets/fonts/Montserrat.ttf);font-weight:100 900;font-display:swap}
:root{--bg:#1F3D2E;--acc:#C49A3C;--tint:#F2E8D2;--cream:#F2E8D2;--ink:#17221C;--ease:cubic-bezier(.65,0,.2,1);--dur:1.1s;--pad:clamp(18px,4.5vw,56px)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--cream);font:16px/1.5 Mont,system-ui,sans-serif;overflow:hidden;transition:background-color var(--dur) var(--ease);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px;border-radius:6px}

#stage{position:fixed;inset:0;overflow:hidden;touch-action:pan-y}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 30% 20%,transparent 40%,#0006 100%)}

/* the table */
#table{position:absolute;left:0;top:0;width:1600px;height:1600px;transform-origin:50% 50%;transition:transform var(--dur) var(--ease)}
#top{position:absolute;inset:0;border-radius:50%;background:#F2E8D2 url(assets/linen.webp) center/50% auto;box-shadow:0 40px 120px #000a,0 0 0 1px #0003}
#top::before{content:"";position:absolute;inset:0;border-radius:50%;background:var(--tint);mix-blend-mode:multiply;opacity:.5;transition:background-color var(--dur) var(--ease)}
#top::after{content:"";position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle at 38% 32%,#fff3 0,transparent 45%),radial-gradient(circle,transparent 62%,#3a2a1433 88%,#2a1c0c66 100%)}
#wheel{position:absolute;inset:0;transition:transform var(--dur) var(--ease),opacity .3s ease}
#wheel.free{transition:opacity .3s ease}
#wheel.swapping{opacity:0}
#ring{position:absolute;left:38%;top:38%;width:24%;height:24%;opacity:.42}
.plate{position:absolute;left:38%;top:38%;width:24%;height:24%;border-radius:50%;transition:opacity .6s ease,filter .6s ease}
.plate>img{position:absolute;left:-6.82%;top:-6.82%;width:113.64%;height:113.64%;max-width:none;display:block;transition:transform var(--dur) var(--ease);-webkit-user-drag:none;user-select:none} /* image tile = vessel / 0.88; its soft shadow is baked in */
.plate.on>img{transform:scale(1.08)}
.ing{position:absolute;left:50%;top:50%;width:var(--s);aspect-ratio:1;margin:calc(var(--s)/-2) 0 0 calc(var(--s)/-2);pointer-events:none;opacity:0;transform:translate(0,0) scale(.25) rotate(var(--r0));transition:transform .5s ease,opacity .3s ease;filter:drop-shadow(0 10px 10px #0006)}
.ing img,.prop img{width:100%;height:100%;object-fit:contain;display:block}  /* sized by the longest side, so a tall chilli is no bigger than a round lime */
body[data-view=detail] .plate.on .ing{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1) rotate(var(--r));transition:transform 1s cubic-bezier(.2,.85,.25,1.12),opacity .4s ease;transition-delay:calc(var(--k)*80ms + 420ms)}
.prop{position:absolute;left:50%;top:50%;aspect-ratio:1;pointer-events:none;filter:drop-shadow(0 6px 7px #0005);transition:opacity .6s ease}
body[data-view=detail] .plate:not(.on){opacity:.14;filter:saturate(.4);pointer-events:none}
body[data-view=detail] .prop{opacity:0}
body[data-view=detail] .plate.on>img{transform:scale(1.02)}

/* header */
header{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:calc(14px + env(safe-area-inset-top)) var(--pad) 10px}
.brand{flex:none;display:flex;flex-direction:column;gap:3px;text-decoration:none}
.brand img{height:46px;width:auto;display:block;margin:-6px 0 -4px -8px}
.brand span{font-size:8.5px;letter-spacing:.34em;text-transform:uppercase;color:var(--acc);opacity:.9;white-space:nowrap}
#tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;min-width:0}
#tabs::-webkit-scrollbar{display:none}
#tabs button{flex:none;min-height:40px;padding:0 14px;border-radius:99px;font-size:10.5px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;opacity:.72;transition:opacity .2s,background .2s,color .2s}
#tabs button:hover{opacity:1}
#tabs button[aria-current=true]{opacity:1;background:#f2e8d21f;color:var(--acc)}
.full{flex:none;font-size:11px;letter-spacing:.2em;text-transform:uppercase;text-decoration:none;padding:10px 16px;border:1px solid #f2e8d244;border-radius:99px;white-space:nowrap;transition:background .25s,color .25s}
.full:hover{background:var(--cream);color:var(--ink)}

/* dish panel */
#panel{position:fixed;z-index:4;left:var(--pad);top:88px;bottom:28px;width:min(33vw,420px);display:flex;flex-direction:column;justify-content:safe center;overflow-y:auto;scrollbar-width:none;transition:opacity .5s ease .25s,visibility 0s .25s}
#panel::-webkit-scrollbar{display:none}
body[data-view=table] #panel{opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s .3s;pointer-events:none}
#swap{transition:opacity .28s ease,transform .28s ease}
#swap.out{opacity:0;transform:translateY(10px)}
.count{display:flex;align-items:center;gap:12px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;opacity:.75}
.count span{white-space:nowrap}
.count b{color:var(--acc);font-weight:600}
.count i{flex:none;width:28px;height:1px;background:currentColor;opacity:.6}
h1{margin:14px 0 14px;font:400 clamp(38px,4.6vw,66px)/1.04 Prata,Georgia,serif;letter-spacing:-.01em;text-wrap:balance}
h1 em{display:block;font-style:normal;color:var(--acc);transition:color var(--dur)}
.desc{margin:0 0 20px;font-size:15.5px;line-height:1.55;opacity:.86;max-width:40ch}
.marks{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:0 0 18px;font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.m{display:inline-block;width:13px;height:13px;border:1.5px solid;position:relative;background:#F2E8D2;vertical-align:-2px;margin-right:6px}
.m::after{content:"";position:absolute;inset:2px;border-radius:50%;background:currentColor}
.m.v{color:#2e8b3d}.m.n{color:#c2271d}
.heat{color:var(--acc);letter-spacing:2px;font-size:17px;line-height:1;vertical-align:-1px}
.buy{display:flex;align-items:center;flex-wrap:wrap;gap:12px 20px}
.price{font:400 30px/1 Prata,Georgia,serif;white-space:nowrap}
.price small{font:500 11px Mont,sans-serif;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-right:8px}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:44px;padding:0 22px;border-radius:99px;background:var(--cream);color:var(--ink);font-size:11.5px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;white-space:nowrap;transition:transform .2s,background .2s}
.btn:hover{background:#FBF4E4;transform:translateY(-1px)}
.nav{display:flex;align-items:center;gap:14px;margin-top:26px}
.arrow{flex:none;width:44px;height:44px;border-radius:50%;border:1px solid #f2e8d255;display:grid;place-items:center;transition:background .2s,color .2s}
.arrow:hover{background:var(--cream);color:var(--ink)}
.arrow svg{width:16px;height:16px}
.dots{display:flex;gap:2px}
.dots button{width:22px;height:44px;position:relative}
.dots button::after{content:"";position:absolute;left:3px;right:3px;top:50%;height:2px;margin-top:-1px;background:currentColor;opacity:.3;transition:opacity .3s,background .3s}
.dots button[aria-current=true]::after{opacity:1;background:var(--acc)}

/* detail */
body:not([data-view=detail]) .detail{display:none!important}
body[data-view=detail] .browse{display:none}
body[data-view=detail] h1{font-size:clamp(32px,3.6vw,52px);margin-bottom:10px}
@media (min-aspect-ratio:1/1) and (min-width:761px){body[data-view=detail] #panel{width:min(28vw,380px)}}
@media (min-aspect-ratio:1/1) and (min-width:761px) and (max-height:800px){h1{font-size:clamp(34px,4vw,54px);margin:10px 0}body[data-view=detail] h1{font-size:clamp(28px,3vw,40px);margin-bottom:4px}.desc{font-size:14.5px;margin-bottom:12px}.marks{margin-bottom:10px}.on-plate li{padding:5px 0;font-size:14px}.lab{margin-top:10px}.prices{margin-top:12px}.back{min-height:34px}#panel{top:78px;bottom:14px}}
.back{display:inline-flex;align-items:center;gap:8px;min-height:44px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.8}
.back:hover{opacity:1;color:var(--acc)}
.lab{margin:16px 0 4px;font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--acc)}
.on-plate{list-style:none;margin:0;padding:0}
.on-plate li{padding:8px 0;border-bottom:1px solid #f2e8d222;font-size:14.5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 24px}
.two p{margin:0;font-size:13.5px;line-height:1.45;opacity:.9}
.prices{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
.prices span{border:1px solid #f2e8d255;border-radius:99px;padding:8px 16px;font-size:14px;white-space:nowrap}
.prices b{font:400 18px Prata,serif;color:var(--acc);margin-left:8px}

/* opening view */
#intro{position:fixed;z-index:4;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;padding:0 20px;transition:opacity .4s ease,visibility 0s}
#intro p{margin:0;font-size:11px;letter-spacing:.26em;text-transform:uppercase;opacity:.8}
#intro b{color:var(--acc);font-weight:600}
body:not([data-view=table]) #intro{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s .3s}
.note{position:fixed;z-index:4;right:var(--pad);bottom:calc(14px + env(safe-area-inset-bottom));margin:0;font-size:10.5px;opacity:.5;max-width:46ch;text-align:right}
body[data-view=table] .note{display:none}

/* phone and portrait */
@media (max-aspect-ratio:1/1),(max-width:760px){
 header{flex-wrap:wrap;gap:6px 12px;padding-bottom:0}
 #tabs{order:3;flex:0 0 calc(100% + 2*var(--pad));margin:0 calc(-1*var(--pad));padding:0 calc(var(--pad) - 8px)}
 #tabs button{min-height:38px;padding:0 11px;font-size:10px;letter-spacing:.16em}
 #panel{left:20px;right:20px;width:auto;top:calc(112px + env(safe-area-inset-top));bottom:auto;display:block;overflow:visible}
 h1{font-size:clamp(30px,9vw,44px);margin:6px 0 8px}
 .desc{font-size:14px;line-height:1.45;margin-bottom:10px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
 .marks{margin-bottom:10px;font-size:10.5px}
 .count{flex-wrap:wrap;gap:2px 10px;font-size:10px;letter-spacing:.2em}
 .price{font-size:25px}
 .nav{margin-top:8px;gap:8px}
 .dots button{width:clamp(14px,5vw,22px)}
 .btn{padding:0 18px}
 .brand img{height:40px}.brand span{font-size:7.5px}
 .full{padding:9px 13px;font-size:10px}
 .note{display:none}
 body[data-view=detail] #panel{bottom:0;overflow-y:auto;padding-bottom:40vh;-webkit-mask:linear-gradient(#000 0,#000 calc(100% - 38vh),transparent calc(100% - 31vh));mask:linear-gradient(#000 0,#000 calc(100% - 38vh),transparent calc(100% - 31vh))}
 body[data-view=detail] h1{font-size:clamp(28px,8vw,38px)}
 body[data-view=detail] .desc{-webkit-line-clamp:unset;display:block;margin-bottom:8px}
 body[data-view=detail] .back{min-height:36px}
 .on-plate li{padding:6px 0;font-size:14px}
 .lab{margin-top:10px}
 .prices{margin-top:12px}
}
@media (prefers-reduced-motion:reduce){:root{--dur:.01s}#swap,.plate,.prop,.ing,#wheel{transition:none!important}}
</style>

const D0=1600,RAD=.345,PW=.24;                 // table base size (px), plate ring radius and plate width as shares of the table
const $=s=>document.querySelector(s);
const body=document.body,table=$('#table'),wheel=$('#wheel'),swap=$('#swap');
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
let view='table',sec=0,idx=0,R=-90,A=235,spinning=true,last=0,plates=[],dots=[],STEP=45;
const narrow=()=>innerWidth/innerHeight<1||innerWidth<=760;
const dishes=()=>SECTIONS[sec].dishes;
const setTone=t=>{body.style.setProperty('--bg',TONES[t]);body.style.setProperty('--acc',t==='red'||t==='cream'?'#E2AA4A':'#C49A3C')};  // on burgundy and navy the accent is the logo's lighter foil gold, for contrast

const tabs=SECTIONS.map((s,i)=>{const b=document.createElement('button');b.type='button';b.textContent=s.tab;b.addEventListener('click',()=>go(0,view==='detail'?'browse':view,i));$('#tabs').appendChild(b);return b});

// put one section's plates, their ingredients, the garnishes and the dots on the table
function build(){
 wheel.querySelectorAll('.plate,.prop').forEach(e=>e.remove());$('#dots').innerHTML='';
 const S=SECTIONS[sec],ds=S.dishes,n=ds.length;STEP=360/n;
 let k=0;const prop=(ang,dist,size)=>{const f=S.props[k++%S.props.length],p=document.createElement('div');p.className='prop';
  p.style.cssText=`width:${size}%;margin:${-size/2}% 0 0 ${-size/2}%;transform:rotate(${ang}deg) translateX(${dist/(size/100)*100}%) rotate(${(k*67)%360}deg)`;
  p.innerHTML=`<img src="assets/ing/${f}.webp" alt="">`;wheel.appendChild(p)};
 for(let i=0;i<n;i++){const mid=(i+.5)*STEP;                  // garnishes sit in the gaps between plates
  if(n<=5){prop(mid,RAD,10);prop(mid,.19,7.5)} else prop(mid,i%2?.2:(n>=7?.45:.43),i%2?7.5:8.5)}
 plates=ds.map((d,i)=>{const b=document.createElement('button');b.className='plate';b.type='button';b.setAttribute('aria-label',d.a+' '+d.b);
  b.innerHTML=d.ing.map((f,j)=>`<span class="ing" style="--k:${j}"><img src="assets/ing/${f}.webp" alt="" loading="lazy"></span>`).join('')+`<img src="assets/plates/${d.id}.webp" alt="" draggable="false">`;
  b.addEventListener('click',e=>{e.stopPropagation();if(view==='table')go(i,'browse');else if(i===idx)go(i,view==='browse'?'detail':'browse');else go(i,'browse')});
  wheel.appendChild(b);return b});
 dots=ds.map((d,i)=>{const b=document.createElement('button');b.type='button';b.setAttribute('aria-label',`Dish ${i+1}: ${d.a} ${d.b}`);b.addEventListener('click',()=>go(i));$('#dots').appendChild(b);return b});
 tabs.forEach((b,i)=>b.setAttribute('aria-current',String(i===sec)));
 const tb=$('#tabs'),t=tabs[sec];tb.scrollLeft=t.offsetLeft-tb.offsetLeft-(tb.clientWidth-t.offsetWidth)/2;
 $('#isec').textContent=S.name;$('#inote').textContent=S.note;$('#tot').textContent=String(n).padStart(2,'0');
 placePlates();placeIngs();
}
function layout(){
 const W=innerWidth,H=innerHeight,n=narrow();let D,cx,cy;
 A=n?270:235;                                   // where the active plate sits, as a direction from the table centre
 if(view==='table'){D=n?Math.min(W*.96,H*.56):Math.min(W*.9,H*.72);cx=W/2;cy=n?H*.49:H*.48}
 else{
  let P,px,py;
  if(view==='browse'){ if(n){P=Math.min(W*.62,H*.3);px=W/2;py=Math.max(H*.69,440+P/2)} else {P=Math.min(H*.5,W*.3);px=W*.66;py=H*.5} }
  else { if(n){P=Math.min(W*.56,H*.27);px=W/2;py=H*.9} else {P=Math.min(H*.58,W*.33);px=W*.74;py=H*.53} }
  D=P/PW;const a=A*Math.PI/180;cx=px-RAD*D*Math.cos(a);cy=py-RAD*D*Math.sin(a);
 }
 table.style.transform=`translate(${cx-D0/2}px,${cy-D0/2}px) scale(${D/D0})`;
 placePlates();placeIngs();
}
// the dish's own ingredients spread out around its plate in the detail view: [direction, distance, size (in plate widths), turn]
const SPREAD={wide:[[205,.78,.36,-18],[287,.76,.33,12],[24,.76,.32,-8],[118,.76,.34,24]],narrow:[[200,.72,.3,-18],[247,.78,.3,10],[293,.78,.3,-10],[340,.72,.3,22]]};
function placeIngs(){const sp=SPREAD[narrow()?'narrow':'wide'];
 plates.forEach(p=>{const es=p.querySelectorAll('.ing');es.forEach((e,k)=>{const [ang,d,sz,r]=es.length===1?[narrow()?270:205,.78,.38,-12]:sp[k],a=ang*Math.PI/180;
  e.style.setProperty('--s',sz*100+'%');e.style.setProperty('--tx',d/sz*100*Math.cos(a)+'%');e.style.setProperty('--ty',d/sz*100*Math.sin(a)+'%');e.style.setProperty('--r',r+'deg');e.style.setProperty('--r0',r-90+'deg')})})}
function placePlates(){ // each plate sits upright when it reaches the active spot
 plates.forEach((p,i)=>{p.style.transform=`rotate(${i*STEP}deg) translateX(${RAD/PW*100}%) rotate(${-A}deg)`})
}
function turnTo(i){ // shortest way round
 const target=A-i*STEP;let d=((target-R)%360+540)%360-180;R+=d;wheel.style.transform=`rotate(${R}deg)`
}
function fill(){
 const S=SECTIONS[sec],d=S.dishes[idx];
 $('#num').textContent=String(idx+1).padStart(2,'0');$('#cat').textContent=S.name+(d.tag?' · '+d.tag:'');
 $('#name').innerHTML=`${d.a} <em>${d.b}</em>`;$('#desc').textContent=d.desc;
 const mk={v:'<span><i class="m v"></i>Veg</span>',nv:'<span><i class="m n"></i>Non-veg</span>',vn:'<span><i class="m v"></i>Veg</span><span><i class="m n"></i>Non-veg</span>'}[d.v];
 $('#marks').innerHTML=mk+(d.heat?`<span>Spice <b class="heat" title="Spice ${d.heat} of 3">${'•'.repeat(d.heat)}</b></span>`:'');
 $('#price').innerHTML=(d.from?'<small>from</small>':'')+d.price;
 $('#onplate').innerHTML=d.on.map(x=>`<li>${x}</li>`).join('');$('#al').textContent=d.al||'None listed. Please tell us about any allergy.';
 $('#know').textContent=d.know||'';$('#knowbox').style.display=d.know?'':'none';
 $('#prices').innerHTML=(d.vars||[['Price',d.price]]).map(([k,p])=>`<span>${k}<b>${p}</b></span>`).join('');
 setTone(d.tone);
 plates.forEach((p,i)=>p.classList.toggle('on',i===idx&&view!=='table'));
 dots.forEach((b,i)=>b.setAttribute('aria-current',String(i===idx)));
}
function go(i,v,s){
 v=v||view;if(s===undefined)s=sec;const NS=SECTIONS.length;let dir=s>sec?1:-1;
 if(s===sec&&v!=='table'&&view!=='table'){                 // stepping past either end moves on to the next table
  if(i>=SECTIONS[s].dishes.length){s=(sec+1)%NS;i=0;dir=1} else if(i<0){s=(sec-1+NS)%NS;i=SECTIONS[s].dishes.length-1;dir=-1}}
 const n=SECTIONS[s].dishes.length;i=((i%n)+n)%n;
 if(s!==sec){                                              // other table: fade the plates out, lay the new ones, turn them in
  clearTimeout(go.t);clearTimeout(go.s);swap.classList.add('out');wheel.classList.add('swapping');spinning=false;
  go.s=setTimeout(()=>{sec=s;idx=i;view=v;body.dataset.view=v;build();wheel.classList.add('free');
   const off=reduce?0:70*dir;R=(v==='table'?-90:A-i*STEP)+off;wheel.style.transform=`rotate(${R}deg)`;layout();wheel.offsetWidth;wheel.classList.remove('free','swapping');
   if(v==='table'){R-=off;wheel.style.transform=`rotate(${R}deg)`;setTone('green');swap.classList.remove('out');
    go.s=setTimeout(()=>{if(view==='table'&&!reduce){spinning=true;last=0;wheel.classList.add('free');requestAnimationFrame(spin)}},1150)}
   else{turnTo(i);fill();swap.classList.remove('out')}
  },reduce?0:300);return}
 const changed=i!==idx||v!==view,wasTable=view==='table';
 clearTimeout(go.s);idx=i;view=v;spinning=view==='table'&&!reduce;last=0;
 body.dataset.view=view;wheel.classList.toggle('free',spinning);
 if(view==='table'){setTone('green');plates.forEach(p=>p.classList.remove('on'));layout();if(spinning)requestAnimationFrame(spin);return}
 layout();turnTo(idx);
 if(wasTable||reduce){fill()} else if(changed){swap.classList.add('out');clearTimeout(go.t);go.t=setTimeout(()=>{fill();swap.classList.remove('out')},280)}
 $('#panel').scrollTop=0;
}
function spin(t){ // slow idle turn on the opening view
 if(!spinning)return;if(last){R+=(t-last)*.004;wheel.style.transform=`rotate(${R}deg)`}last=t;requestAnimationFrame(spin)
}

$('#start').addEventListener('click',()=>go(0,'browse'));
$('#top').addEventListener('click',()=>{if(view==='table')go(0,'browse')});
$('#view').addEventListener('click',()=>go(idx,'detail'));
$('#back').addEventListener('click',()=>go(idx,'browse'));
$('#home').addEventListener('click',e=>{e.preventDefault();go(idx,'table')});
$('#prev').addEventListener('click',()=>go(idx-1));$('#next').addEventListener('click',()=>go(idx+1));
addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key==='ArrowDown'){e.preventDefault();view==='table'?go(0,'browse'):go(idx+1,'browse')}
 else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();view==='table'?go(dishes().length-1,'browse'):go(idx-1,'browse')}
 else if(e.key==='Escape'){go(idx,view==='detail'?'browse':'table')}
});
let acc=0,cool=0;
addEventListener('wheel',e=>{ if(view==='detail')return;const now=performance.now();if(now<cool)return;
 acc+=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX;
 if(Math.abs(acc)>50){const dir=acc>0?1:-1;acc=0;cool=now+750;view==='table'?go(dir>0?0:dishes().length-1,'browse'):go(idx+dir)} },{passive:true});
let sx=null,sy=0;
$('#stage').addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
$('#stage').addEventListener('touchend',e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;sx=null;
 if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3&&view!=='table')go(idx+(dx<0?1:-1),'browse')},{passive:true});
addEventListener('resize',()=>{layout();if(view!=='table'){wheel.classList.add('free');turnTo(idx);wheel.offsetWidth;wheel.classList.remove('free')}});

// start. ?dish=fever opens on a dish, &view=detail opens it up, ?section=mains opens that table
const q=new URLSearchParams(location.search),qv=q.get('view');let qd=-1;
SECTIONS.forEach((S,si)=>{const di=S.dishes.findIndex(d=>d.id===q.get('dish'));if(di>=0){sec=si;qd=di} else if(S.id===q.get('section')&&qd<0)sec=si});
table.style.transition='none';build();wheel.style.transform=`rotate(${R}deg)`;layout();setTone('green');
if(qd>=0||qv==='browse'||qv==='detail'){idx=Math.max(qd,0);R=0;view=qv==='detail'?'detail':'browse';spinning=false;body.dataset.view=view;layout();turnTo(idx);fill();wheel.offsetWidth;wheel.classList.remove('free')}
else if(!reduce)requestAnimationFrame(spin); else wheel.classList.remove('free');
requestAnimationFrame(()=>requestAnimationFrame(()=>{table.style.transition=''}));
// warm the cache for the other tables once this one is showing
addEventListener('load',()=>setTimeout(()=>SECTIONS.forEach(S=>S.dishes.forEach(d=>{new Image().src=`assets/plates/${d.id}.webp`})),1500));
</script>
