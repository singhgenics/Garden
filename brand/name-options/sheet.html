<!doctype html><html><head><meta charset="utf-8"><title>Name options in the Cabin East style</title>
<style>
@font-face{font-family:Alfa;src:url(../fonts/AlfaSlabOne-Regular.ttf)}
@font-face{font-family:Pop;src:url(../fonts/Poppins-Regular.ttf)}
@font-face{font-family:PopB;src:url(../fonts/Poppins-SemiBold.ttf)}
body{margin:0;background:#F2E8D2;font-family:Pop,sans-serif;color:#1D2A22}
header{padding:40px 48px 8px}h1{font-family:Alfa;color:#6A1622;font-size:38px;margin:0 0 6px;letter-spacing:.02em}
p{margin:0;font-size:16px;opacity:.8}
main{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;padding:28px 48px 48px}
figure{margin:0;background:#fff;border:2px solid #1D2A22;border-radius:6px;overflow:hidden}
.a{background:#F2E8D2;border-bottom:2px solid #1D2A22}.a img,.b img{display:block;width:100%}
figcaption{padding:12px 16px 16px;display:flex;flex-direction:column;gap:2px}
figcaption b{font-family:PopB;letter-spacing:.14em;text-transform:uppercase;font-size:14px;color:#6A1622}
figcaption span{font-size:14px}
</style></head><body><header><h1>Name options, Cabin East style</h1><p>Six logo directions in the Cabin East palette and lettering. Cream version above, reversed version below.</p></header><main><figure><div class="a"><img src="pickled.svg"></div><div class="b"><img src="pickled-reversed.svg"></div><figcaption><b>Pickled</b><span>Drunk-slang pun, plus the kimchi and achar jar</span></figcaption></figure><figure><div class="a"><img src="salted.svg"></div><div class="b"><img src="salted-reversed.svg"></div><figcaption><b>Salted</b><span>Salted egg yolk, gose, a salt-rimmed glass</span></figcaption></figure><figure><div class="a"><img src="wokhei.svg"></div><div class="b"><img src="wokhei-reversed.svg"></div><figcaption><b>Wokhei</b><span>Cantonese for the breath of the wok</span></figcaption></figure><figure><div class="a"><img src="yumcha.svg"></div><div class="b"><img src="yumcha-reversed.svg"></div><figcaption><b>Yumcha</b><span>Cantonese for drink tea, eat dim sum</span></figcaption></figure><figure><div class="a"><img src="oost.svg"></div><div class="b"><img src="oost-reversed.svg"></div><figcaption><b>Oost</b><span>Dutch for east, with a cabin on the horizon</span></figcaption></figure><figure><div class="a"><img src="kubo.svg"></div><div class="b"><img src="kubo-reversed.svg"></div><figcaption><b>Kubo</b><span>Filipino for a small hut, a cabin on stilts</span></figcaption></figure></main></body></html>
